name: lomax

services:
  floci:
    image: floci/floci:latest
    container_name: floci
    user: root
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    networks:
      - lomax-net

networks:
  lomax-net:
    name: lomax-net

volumes:
  floci-data:
    name: lomax-floci-data